tenants:
  - name: staging
    namespace: sdp-adapter
    replicas: 2
    image:
      repository: ghcr.io/fall-out-bug/sdp-dev-adapter-controller
      tag: latest
    natsURL: nats://nats:4222
    workspace:
      type: pvc
      pvcName: adapter-workspaces
      createPVC: true
      storage: 20Gi
      storageClassName: ""
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 1Gi
