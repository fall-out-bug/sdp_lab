tenants:
  - name: dev
    namespace: sdp-adapter
    replicas: 1
    image:
      repository: ghcr.io/fall-out-bug/sdp-dev-adapter-controller
      tag: latest
    natsURL: nats://nats:4222
    workspace:
      type: emptyDir
      pvcName: adapter-workspaces
      createPVC: false
      storage: 20Gi
      storageClassName: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
