# RBAC for swarm-orchestrator (in sdp-control) to exec into opencode-agent pods in sdp-workers
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: swarm-orchestrator
  namespace: sdp-workers
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: swarm-orchestrator
  namespace: sdp-workers
subjects:
  - kind: ServiceAccount
    name: swarm-orchestrator
    namespace: sdp-control
roleRef:
  kind: Role
  name: swarm-orchestrator
  apiGroup: rbac.authorization.k8s.io
