apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sdp-control
# Override images with versioned tags: kustomize edit set image sdp/intake-gateway:git-$(git rev-parse --short HEAD)
images:
  - name: sdp/intake-gateway
    newTag: latest
  - name: sdp/registry-agent
    newTag: latest
  - name: sdp/swarm-orchestrator
    newTag: latest
  - name: sdp/feature-orchestrator
    newTag: latest
resources:
  - brain-gateway.yaml
  - scheduler.yaml
  - policy-service.yaml
  - nats.yaml
  - swarm-workspaces-pvc.yaml
  - intake-gateway.yaml
  - registry-agent.yaml
  - swarm-orchestrator.yaml
  - feature-orchestrator.yaml
