# NATS JetStream for SDP Swarm Platform
# Provides message bus for agent coordination, artifact streaming, lifecycle events.
# Requires: sdp-control namespace
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: sdp-control
  labels:
    app: nats
data:
  nats.conf: |
    pid_file: "/var/run/nats/nats.pid"
    http: 8222
    port: 4222

    jetstream {
      store_dir: "/data/jetstream/store"
      max_file_store: 1G
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: sdp-control
  labels:
    app: nats
spec:
  clusterIP: None
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
      protocol: TCP
    - name: monitor
      port: 8222
      targetPort: 8222
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: sdp-control
  labels:
    app: nats
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitor
          command:
            - "nats-server"
            - "--config"
            - "/etc/nats-config/nats.conf"
          volumeMounts:
            - name: config
              mountPath: /etc/nats-config
              readOnly: true
            - name: data
              mountPath: /data/jetstream
            - name: pid
              mountPath: /var/run/nats
          livenessProbe:
            httpGet:
              path: /
              port: 8222
            initialDelaySeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8222
            initialDelaySeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: nats-config
        - name: pid
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
