---
apiVersion: v1
kind: ConfigMap
metadata:
  name: feature-orchestrator-config
  namespace: sdp-control
data:
  poll_interval: "30s"
  max_concurrent: "3"
  namespace: "sdp-workers"
  project_filter: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-orchestrator
  namespace: sdp-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feature-orchestrator
  template:
    metadata:
      labels:
        app: feature-orchestrator
    spec:
      serviceAccountName: feature-orchestrator
      containers:
        - name: orchestrator
          # Override at deploy with versioned tag: kustomize edit set image sdp/feature-orchestrator:git-$(git rev-parse --short HEAD)
          image: sdp/feature-orchestrator:latest
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["sh", "-c", "true"]
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "true"]
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: SDP_POLL_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: feature-orchestrator-config
                  key: poll_interval
            - name: SDP_MAX_CONCURRENT
              valueFrom:
                configMapKeyRef:
                  name: feature-orchestrator-config
                  key: max_concurrent
            - name: SDP_AGENTRUN_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: feature-orchestrator-config
                  key: namespace
            - name: SDP_PROJECT_FILTER
              valueFrom:
                configMapKeyRef:
                  name: feature-orchestrator-config
                  key: project_filter
          args:
            - --workspace
            - /workspaces
          ports:
            - name: metrics
              containerPort: 8080
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces
            - name: project-registry
              mountPath: /app/specs
              readOnly: true
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: swarm-workspaces
        - name: project-registry
          configMap:
            name: project-registry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: feature-orchestrator
  namespace: sdp-control
