apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
data:
  promtail.yaml: |
    server:
      http_listen_port: 3101
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki.sdp-observability.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - cri: {}
          - json:
              expressions:
                record_type: record_type
                run_id: event.trace.run_id
                issue_id: event.protocol.issue_id
                phase: event.protocol.phase
                status: event.protocol.status
                component: event.system.component
                agent_role: event.system.agent_role
                model_name: event.model.name
                metric_name: metric.name
          - labels:
              record_type:
              run_id:
              issue_id:
              phase:
              status:
              component:
              agent_role:
              model_name:
              metric_name:
        relabel_configs:
          - action: keep
            source_labels: [__meta_kubernetes_namespace]
            regex: sdp-(workers|control)
          - action: replace
            source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - action: replace
            source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - action: replace
            source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - action: replace
            source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - action: replace
            source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            replacement: /var/log/pods/*$1/*.log
            target_label: __path__
