# Minimal NATS for E2E (adapter needs nats://nats:4222)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: sdp-adapter
  labels:
    app: nats
data:
  nats.conf: |
    port: 4222
    http: 8222
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: sdp-adapter
  labels:
    app: nats
spec:
  clusterIP: None
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: sdp-adapter
  labels:
    app: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitor
          command: ["nats-server", "--config", "/etc/nats/nats.conf"]
          volumeMounts:
            - name: config
              mountPath: /etc/nats
      volumes:
        - name: config
          configMap:
            name: nats-config
