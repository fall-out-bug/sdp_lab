apiVersion: v1
kind: ServiceAccount
metadata:
  name: adapter-controller
  namespace: sdp-adapter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: adapter-controller
  namespace: sdp-adapter
rules:
  - apiGroups: ["sdp.dev"]
    resources: ["agentruns", "agentruns/status", "tasks", "tasks/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: adapter-controller
  namespace: sdp-adapter
subjects:
  - kind: ServiceAccount
    name: adapter-controller
    namespace: sdp-adapter
roleRef:
  kind: Role
  name: adapter-controller
  apiGroup: rbac.authorization.k8s.io
