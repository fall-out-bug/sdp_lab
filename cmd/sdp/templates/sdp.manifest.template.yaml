# SDP Manifest Template — generated by `sdp init`
# Edit this file to declare your project's skills, commands, agents, hooks,
# and MCP servers. Then run `sdp generate-adapters` to regenerate harness
# adapter files from this single source of truth.
#
# Validate: `sdp manifest validate`
# Regenerate adapters: `sdp generate-adapters --write`
# Check drift: `sdp doctor adapters`
version: "1.0.0"
sdp_version: "1.0.0"
harnesses:
  - claude-code
  - opencode
  - codex
  - cursor

# Skills are executable prompt files (.md) that harnesses can invoke.
# Add your project skills here.
skills: []
# Example:
#   - { name: build, path: prompts/skills/build/SKILL.md }

# Commands are user-facing slash commands (Claude Code) or equivalents.
commands: []
# Example:
#   - { name: build, path: prompts/commands/build.md }

# Agents are sub-agents with defined roles.
agents: []
# Example:
#   - { name: implementer, role: implementer, system_prompt_path: prompts/agents/implementer.md }

# Hooks: lifecycle scripts invoked by harnesses (e.g. pre-commit, session-start).
hooks: []
# Example:
#   - { event: pre-commit, script: scripts/hooks/pre-commit.sh, harnesses: [claude-code] }

# MCP servers: optional server-side extensions.
mcp_servers: []
# Example:
#   - { name: my-mcp, url: http://localhost:3100, optional: true }
