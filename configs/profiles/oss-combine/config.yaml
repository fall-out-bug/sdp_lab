# SDP Profile Configuration
# Profile: oss-combine v1.0.0
# Generated by: sdp up --profile oss-combine

profile:
  name: oss-combine
  version: 1.0.0

adapters:
  - system: omo
    endpoint: opencode://session
    contract: schema/contracts/orchestration-event.schema.json
    version: 1.0.0
    enabled: true
  - system: beads
    endpoint: beads://local
    contract: schema/contracts/runtime-decision.schema.json
    version: 1.0.0
    enabled: true
  - system: gas-town
    endpoint: gastown://build
    contract: schema/contracts/orchestration-event.schema.json
    version: 1.0.0
    enabled: true
  - system: sdp-lab
    endpoint: sdp://internal
    contract: schema/contracts/runtime-decision.schema.json
    version: 1.0.0
    enabled: true

guard:
  scopes:
    - name: default
      path: docs/workstreams/backlog
      description: Default workstream scope for task execution
      evidence_path: .sdp/evidence
      enabled: true
    - name: contracts
      path: internal/adapters
      description: Adapter contract scope for SDK development
      evidence_path: .sdp/evidence
      enabled: true
    - name: bridge
      path: internal/bridge
      description: GitHub-Beads bridge scope for findings sync
      evidence_path: .sdp/evidence
      enabled: true

paths:
  evidence: .sdp/evidence
  checkpoints: .sdp/checkpoints
  findings: .sdp/findings
  sessions: .sdp/sessions
  traces: .sdp/traces
