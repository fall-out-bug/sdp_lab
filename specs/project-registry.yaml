# Project registry for SDP swarm. Each project has a repo, workstreams, and model policy.
# Used by federation and orchestrator for multi-project scheduling.

projects:
  - id: sdp_dev
    repo_url: .
    repo_branch: main
    beads_prefix: sdp_dev
    language: go
    workstreams:
      - workstream:generic
      - workstream:builder
    model_policy: ""
    config: {}

  - id: sdp
    repo_url: https://github.com/steveyegge/sdp
    repo_branch: main
    beads_prefix: sdp
    language: go
    workstreams:
      - workstream:generic
    model_policy: ""
    config: {}

  - id: opencode
    repo_url: https://github.com/steveyegge/opencode
    repo_branch: main
    beads_prefix: opencode
    language: go
    workstreams:
      - workstream:generic
    model_policy: ""
    fork: true
    upstream_remote: origin
    config: {}

  - id: kubeopencode
    repo_url: https://github.com/steveyegge/kubeopencode
    repo_branch: main
    beads_prefix: kubeopencode
    language: go
    workstreams:
      - workstream:generic
    model_policy: ""
    fork: true
    upstream_remote: origin
    config: {}

  - id: openclaw
    repo_url: https://github.com/steveyegge/openclaw
    repo_branch: main
    beads_prefix: openclaw
    language: go
    workstreams:
      - workstream:generic
    model_policy: ""
    fork: true
    upstream_remote: origin
    config: {}

  - id: beads
    repo_url: https://github.com/steveyegge/beads
    repo_branch: main
    beads_prefix: beads
    language: go
    workstreams:
      - workstream:generic
    model_policy: ""
    config: {}
