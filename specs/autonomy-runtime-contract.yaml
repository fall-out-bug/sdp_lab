version: v1
name: AutonomousRuntimeModule

operations:
  - claimTask
  - loadTask
  - createBranch
  - executeTask
  - runVerification
  - buildEvidence
  - publishPR
  - updateTaskState
  - escalate

state_machine:
  canonical:
    - open
    - in_progress
    - review
    - verified
    - done
  side_states:
    - blocked
    - escalated
    - cancelled

evidence:
  required_sections:
    - intent
    - plan
    - execution
    - verification
    - review
    - risk_notes
    - boundary
    - provenance
    - trace

boundary_contract:
  required:
    - declared
    - observed
    - compliance
  declared_fields:
    - allowed_path_prefixes
    - control_path_prefixes
    - forbidden_path_prefixes
    - role
    - lane
  observed_fields:
    - touched_paths
    - out_of_boundary_paths
  compliance_fields:
    - ok
    - reason

provenance:
  required:
    - run_id
    - orchestrator
    - runtime
    - model
    - gate_results

model_policy:
  allowlist:
    - glm-5
    - glm-4.7
  fallback_chain:
    - glm-5
    - glm-4.7
    - escalated
