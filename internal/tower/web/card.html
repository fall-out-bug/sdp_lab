{{define "content"}}
<div class="max-w-5xl mx-auto">
  <!-- Back -->
  <a href="/" class="text-sm text-gray-500 hover:text-gray-300 transition mb-4 inline-flex items-center gap-1">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    Board
  </a>

  <!-- Card Header -->
  <div class="bg-surface-2 rounded-xl border border-gray-800 p-5 mb-4">
    <div class="flex items-start justify-between gap-4 mb-3">
      <div class="flex-1">
        <div class="flex items-center gap-2 mb-2 flex-wrap">
          <span class="text-sm font-mono text-gray-500">{{.ID}}</span>
          <span class="text-xs font-medium px-2 py-0.5 rounded border {{priorityColor .Priority}}">{{priorityLabel .Priority}}</span>
          {{if .Phase}}<span class="text-xs px-2 py-0.5 rounded {{phaseColor .Phase}}">{{.Phase}}</span>{{end}}
          <span class="text-xs px-2 py-0.5 rounded {{if eq .Status "open"}}bg-green-500/15 text-green-400{{else}}bg-gray-700/50 text-gray-500{{end}}">{{.Status}}</span>
        </div>
        <h1 class="text-xl font-semibold text-white leading-snug mb-2">{{.Title}}</h1>
        {{if .Description}}<p class="text-sm text-gray-400 leading-relaxed whitespace-pre-wrap max-h-32 overflow-auto">{{.Description}}</p>{{end}}
      </div>
    </div>
    <!-- Labels -->
    {{if .Labels}}
    <div class="flex gap-1 flex-wrap">
      {{range .Labels}}<span class="text-[10px] px-2 py-0.5 rounded border {{labelStyle .}}">{{.}}</span>{{end}}
    </div>
    {{end}}
  </div>

  <!-- Card Detail Content -->
  {{template "card-detail-content" .}}

  <!-- Actions -->
  <div class="flex gap-2 mt-4">
    <form method="POST" action="/card/{{.ID}}/clarify">
      <button class="px-4 py-2 bg-blue-600/20 hover:bg-blue-600/30 border border-blue-600/30 rounded-lg text-sm text-blue-400 transition" type="submit">🔍 Clarify</button>
    </form>
    <form method="POST" action="/card/{{.ID}}/approve">
      <button class="px-4 py-2 bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-600/30 rounded-lg text-sm text-indigo-400 transition" type="submit">✅ Approve Plan</button>
    </form>
    <form method="POST" action="/card/{{.ID}}/close">
      <button class="px-4 py-2 bg-surface-4 hover:bg-gray-600 border border-gray-700 rounded-lg text-sm text-gray-400 transition" type="submit">📦 Close</button>
    </form>
    <form method="POST" action="/card/{{.ID}}/reopen">
      <button class="px-4 py-2 bg-surface-4 hover:bg-gray-600 border border-gray-700 rounded-lg text-sm text-gray-400 transition" type="submit">🔄 Reopen</button>
    </form>
  </div>
</div>
{{end}}
