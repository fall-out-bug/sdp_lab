{{define "layout"}}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SDP Control Tower</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: { 1: '#0f1117', 2: '#1a1d27', 3: '#242836', 4: '#2d3245' }
          }
        }
      }
    }
  </script>
  <style>
    body { background: #0f1117; }
    .card-item { transition: all 0.15s ease; }
    .card-item:hover { background: #2d3245; transform: translateY(-1px); }
    .col-scroll::-webkit-scrollbar { width: 4px; }
    .col-scroll::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }
    .evidence-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .pulse { animation: pulse-slow 2s ease-in-out infinite; }
    .htmx-swapping { opacity: 0; transition: opacity 0.2s ease; }
  </style>
</head>
<body class="text-gray-300 min-h-screen font-sans antialiased">
  <header class="border-b border-gray-800 bg-surface-2/80 backdrop-blur-sm sticky top-0 z-30">
    <div class="max-w-[1800px] mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <h1 class="text-lg font-semibold text-white tracking-tight">⚙️ Control Tower</h1>
        <span class="text-xs text-gray-600 bg-surface-3 px-2 py-0.5 rounded">sdp_lab</span>
      </div>
      <div id="header-stats" class="text-xs text-gray-500"></div>
    </div>
  </header>
  <main class="max-w-[1800px] mx-auto p-4">
    {{template "content" .}}
  </main>
</body>
</html>
{{end}}
