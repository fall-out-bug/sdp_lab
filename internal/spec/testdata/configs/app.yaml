server:
  http_timeout: 30s
  request_timeout: 60s
  max_connections: 25
  read_timeout: 10s

database:
  pool_size: 10
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 300s
  database_url: "postgres://user:s3cret@localhost:5432/mydb"

retry:
  max_retries: 3
  retry_delay: 100ms
  backoff: exponential

rate_limit:
  requests_per_second: 100
  burst: 20

cache:
  ttl: 300s
  max_size: 1000

auth:
  api_key: "super-secret-key-12345"
  token: "bearer-token-value"
  secret: "my-secret-value"

health:
  endpoint: "/health"
  interval: 10s

feature_flags:
  dark_mode: true
  new_checkout: false
