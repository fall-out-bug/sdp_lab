# SDP project config for sdp_dev
version: 1

quality:
  coverage_threshold: 80
  max_file_loc: 200
  complexity_threshold: 40
  complexity_exclude:
    - "cmd/"
  # cmd packages are integration-style; coverage measured on internal/
  # cmd: integration-style; beads/orchestrator/openclaw: bd CLI / SSH / external deps
  coverage_exclude:
    - "cmd/"
    - "internal/runtime"
    - "internal/beads"
    - "internal/orchestrator"
    - "internal/openclaw"

guard:
  mode: "standard"
  rules_file: ".sdp/guard-rules.yml"
