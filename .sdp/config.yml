# SDP project config for sdp_dev
version: 1

quality:
  coverage_threshold: 80
  max_file_loc: 200
  # cmd packages are integration-style; coverage measured on internal/
  coverage_exclude:
    - "cmd/adapter-controller"
    - "cmd/autonomy-worker"
    - "cmd/beads-fsm"
    - "cmd/brain-gateway"
    - "cmd/evaluator-orchestrator"
    - "cmd/flow-inspect"
    - "cmd/openclaw-agent"
    - "cmd/opencode-agent"
    - "cmd/operator-gate"
    - "cmd/orchestrator"
    - "cmd/pr-gate"
    - "cmd/pr-publish"
    - "cmd/redaction-check"
    - "cmd/runtime-parity-check"
    - "cmd/self-improve-agent"
    - "cmd/swarm-agent"
    - "cmd/swarm-reviewer"
    - "cmd/swarm-worker"

guard:
  mode: "standard"
  rules_file: ".sdp/guard-rules.yml"
