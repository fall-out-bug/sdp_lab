# SDP Manifest — single source of truth for generated skills, commands, agents,
# and validated inventory metadata across all SDP-supported harnesses.
#
# Validate: `sdp manifest validate`
# Schema:   `sdp manifest schema` (or internal/manifest/schema.json)
# Design:   docs/plans/2026-04-25-f141-multi-harness-install-bootstrap-design.md
#
# This manifest captures the *current* canonical inventory. F141-02 (adapter
# generator) and F141-06 (migration) make harness adapter trees derive from
# these entries; until then the manifest is read-only inventory + drift gate.
