# Goreleaser config for SDP CLIs
# Triggers on tag push (e.g. v0.1.0)
version: 2
project_name: sdp-cli

env:
  - CGO_ENABLED=0

builds:
  - id: sdp-evidence
    main: ./cmd/sdp-evidence
    binary: sdp-evidence
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

  - id: sdp-guard
    main: ./cmd/sdp-guard
    binary: sdp-guard
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: sdp-orchestrate
    main: ./cmd/sdp-orchestrate
    binary: sdp-orchestrate
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: sdp-ci-loop
    main: ./cmd/sdp-ci-loop
    binary: sdp-ci-loop
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: sdp-eval
    main: ./cmd/sdp-eval
    binary: sdp-eval
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: sdp-evidence
    format: tar.gz
    name_template: "sdp-evidence_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - sdp-evidence
    format_overrides:
      - goos: windows
        format: zip

  - id: sdp-guard
    format: tar.gz
    name_template: "sdp-guard_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - sdp-guard

  - id: sdp-orchestrate
    format: tar.gz
    name_template: "sdp-orchestrate_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - sdp-orchestrate

  - id: sdp-ci-loop
    format: tar.gz
    name_template: "sdp-ci-loop_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - sdp-ci-loop

  - id: sdp-eval
    format: tar.gz
    name_template: "sdp-eval_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - sdp-eval

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

signs:
  - cmd: cosign
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: checksum
    output: true

release:
  name_template: "SDP v{{ .Version }}"
  header: |
    ## SDP — Structured Development Protocol Trust Layer

    `sdp-evidence` validates in-toto attestations generated by AI coding agents.
    It answers: "Did the agent plan, stay in scope, pass tests, and get reviewed?"

    ### Quick Start (Light Mode)

    ```bash
    # Add CI gates to your repo
    # See docs/getting-started.md for full setup
    sdp-evidence validate .sdp/evidence/F028.json
    sdp-evidence inspect .sdp/evidence/F028.json
    ```

    ### What's New
  footer: |
    ---
    Predicate spec: `https://sdp.dev/attestation/coding-workflow/v1`
    Schema: `sdp/schema/coding-workflow-predicate.schema.json`

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
