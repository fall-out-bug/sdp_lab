# Goreleaser config for sdp-evidence CLI
# Triggers on tag push (e.g. v0.1.0)
version: 2
project_name: sdp-evidence

builds:
  - id: sdp-evidence
    main: ./cmd/sdp-evidence
    binary: sdp-evidence
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # darwin/arm64 only (skip linux/arm64 for now)
    ignore:
      - goos: linux
        goarch: arm64

archives:
  - id: sdp-evidence
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - sdp-evidence

checksum:
  name_template: "checksums.txt"

release:
  name_template: "{{ .ProjectName }} {{ .Tag }}"
