name: prompt-injection-corpus

on:
  pull_request:
    paths:
      - 'docs/security/f164-prompt-injection-*.md'
      - 'schema/prompt-injection-corpus.schema.json'
      - 'internal/evals/pi_*'
      - 'cmd/sdp-eval/**'
      - 'cmd/sdp-pi-eval/**'
      - 'scripts/check-prompt-injection-corpus.sh'
      - 'scripts/prompt-injection-check.sh'
      - 'prompts/**'
      - '.agents/skills/**'
      - '.pi/APPEND_SYSTEM.md'
  workflow_dispatch: {}

jobs:
  static-mock:
    name: Static and mock PI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run blocking static/mock checks
        run: scripts/check-prompt-injection-corpus.sh

      - name: Upload prompt-injection report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: prompt-injection-corpus-report
          path: .sdp/findings/prompt-injection-corpus.txt
