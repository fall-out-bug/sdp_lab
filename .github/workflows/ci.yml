name: CI

on:
  push:
    branches: [master, main, feature/*]
  pull_request:
    branches: [master, main, feature/*]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./...

  k8s-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Validate control plane manifests
        run: kubectl kustomize deploy/k8s/control/ > /dev/null

      - name: Validate adapter manifests
        run: |
          kubectl kustomize deploy/k8s/adapter/ > /dev/null
          kubectl kustomize deploy/k8s/adapter/overlays/dev > /dev/null
          kubectl kustomize deploy/k8s/adapter/overlays/staging > /dev/null
          kubectl kustomize deploy/k8s/adapter/overlays/prod > /dev/null

      - name: Validate workers manifests
        run: kubectl kustomize deploy/k8s/workers/ > /dev/null

  evidence-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Validate evidence files
        run: |
          set -e
          EVIDENCE_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^\.sdp/evidence/.*\.json$' || true)
          if [ -z "$EVIDENCE_FILES" ]; then
            echo "No evidence files changed — skipping validation"
            exit 0
          fi
          for f in $EVIDENCE_FILES; do
            if [ -f "$f" ]; then
              echo "Validating: $f"
              go run ./cmd/sdp-evidence validate --require-pr-url=false "$f"
            fi
          done

      - name: Validate review verdict
        run: |
          set -e
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^\.sdp/review_verdict\.json$'; then
            if [ -f .sdp/review_verdict.json ]; then
              echo "Validating review verdict"
              jq -e '.verdict | test("^(APPROVED|CHANGES_REQUESTED)$")' .sdp/review_verdict.json
              jq -e '.feature and (.finding_ids | type == "array")' .sdp/review_verdict.json
            fi
          else
            echo "No review verdict changed — skipping"
          fi

  scope-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Check scope compliance
        run: |
          set -e
          CHECKPOINT_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^\.sdp/checkpoints/.*\.json$' || true)
          if [ -z "$CHECKPOINT_FILES" ]; then
            echo "No checkpoint files — scope gate not applicable"
            exit 0
          fi
          for cpf in $CHECKPOINT_FILES; do
            if [ -f "$cpf" ]; then
              FEATURE_ID=$(jq -r '.feature_id' "$cpf" 2>/dev/null || echo "")
              if [ -z "$FEATURE_ID" ]; then continue; fi
              WS_IDS=$(jq -r '.workstreams[]?.id // empty' "$cpf" 2>/dev/null || echo "")
              for ws in $WS_IDS; do
                if [ -f "docs/workstreams/backlog/${ws}.md" ]; then
                  echo "Checking scope for $ws"
                  go run ./cmd/sdp-guard --ws "$ws" || echo "WARN: scope violation in $ws (non-blocking)"
                fi
              done
            fi
          done

  policy-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OPA
        run: |
          curl -sL -o opa https://openpolicyagent.org/downloads/v1.4.2/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/

      - name: Collect policy input
        run: |
          set -e
          BASE="${{ github.base_ref }}"
          CHANGED=$(git diff --name-only origin/$BASE...HEAD)
          EVIDENCE_COUNT=$(echo "$CHANGED" | grep -c '^\.sdp/evidence/' || echo 0)
          HAS_WS=$(echo "$CHANGED" | grep -c '^docs/workstreams/' || echo 0)
          HAS_FEATURE=$(echo "$CHANGED" | grep -c '^internal/\|^cmd/' || echo 0)
          cat > /tmp/policy-input.json <<HEREDOC
          {
            "evidence_files_count": $EVIDENCE_COUNT,
            "evidence_validation_passed": true,
            "has_workstream_changes": $([ "$HAS_WS" -gt 0 ] && echo true || echo false),
            "scope_violations_count": 0,
            "p0_findings": 0,
            "p1_findings": 0,
            "p2_findings": 0,
            "has_feature_changes": $([ "$HAS_FEATURE" -gt 0 ] && echo true || echo false),
            "beads_referenced": true
          }
          HEREDOC
          echo "=== Policy Input ==="
          cat /tmp/policy-input.json

      - name: Evaluate policies
        run: |
          set -e
          echo "=== Policy Evaluation ==="
          for policy in .sdp/policies/*.rego; do
            echo "--- $(basename $policy) ---"
            opa eval --data "$policy" --input /tmp/policy-input.json \
              'data.sdp.policies.deny' --format pretty || true
          done

  auto-attestation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [build-test]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Generate auto-attestation
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -e
          mkdir -p .sdp/attestations
          go run -tags ci_attest ./internal/evidence/cmd/auto-attest \
            --base-branch "$BASE_REF" \
            --pr-number "$PR_NUMBER" \
            --pr-url "$PR_URL" \
            --output .sdp/attestations/ci-auto.json \
            --report .sdp/attestations/ci-auto-report.json || true
          if [ -f .sdp/attestations/ci-auto-report.json ]; then
            echo "=== Auto-Attestation Report ==="
            cat .sdp/attestations/ci-auto-report.json
          fi

  image-build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push opencode-agent
        env:
          IMAGE_TAG: git-${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/sdp-dev-opencode-agent:${IMAGE_TAG}"
          echo "Building ${IMAGE}"
          mkdir -p .tmp/opencode-runtime
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o .tmp/opencode-runtime/opencode-agent ./cmd/opencode-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o .tmp/opencode-runtime/orchestrator ./cmd/orchestrator
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o .tmp/opencode-runtime/swarm-worker ./cmd/swarm-worker
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o .tmp/opencode-runtime/swarm-reviewer ./cmd/swarm-reviewer
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o .tmp/opencode-runtime/autonomy-worker ./cmd/autonomy-worker
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o .tmp/opencode-runtime/beads-fsm ./cmd/beads-fsm
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o .tmp/opencode-runtime/pr-gate ./cmd/pr-gate
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o .tmp/opencode-runtime/pr-publish ./cmd/pr-publish
          if [ ! -d .tmp/beads-src ]; then
            git clone --depth 1 --branch v0.49.6 https://github.com/steveyegge/beads.git .tmp/beads-src
          fi
          (cd .tmp/beads-src && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../opencode-runtime/bd ./cmd/bd)
          docker build -t "${IMAGE}" -f deploy/images/opencode-agent/Dockerfile.runtime .
          docker push "${IMAGE}"

      - name: Build and push swarm-orchestrator
        env:
          IMAGE_TAG: git-${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/sdp-dev-swarm-orchestrator:${IMAGE_TAG}"
          echo "Building ${IMAGE}"
          docker build -t "${IMAGE}" -f deploy/images/swarm-orchestrator/Dockerfile .
          docker push "${IMAGE}"

      - name: Build and push intake-gateway
        env:
          IMAGE_TAG: git-${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/sdp-dev-intake-gateway:${IMAGE_TAG}"
          echo "Building ${IMAGE}"
          docker build -t "${IMAGE}" -f deploy/images/intake-gateway/Dockerfile .
          docker push "${IMAGE}"

      - name: Build and push adapter-controller
        env:
          IMAGE_TAG: git-${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/sdp-dev-adapter-controller:${IMAGE_TAG}"
          echo "Building ${IMAGE}"
          docker build -t "${IMAGE}" -f deploy/images/adapter-controller/Dockerfile .
          docker push "${IMAGE}"

      - name: Build and push feature-orchestrator
        env:
          IMAGE_TAG: git-${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/sdp-dev-feature-orchestrator:${IMAGE_TAG}"
          echo "Building ${IMAGE}"
          docker build -t "${IMAGE}" -f deploy/images/feature-orchestrator/Dockerfile .
          docker push "${IMAGE}"

      - name: Build and push telemetry-analyzer
        env:
          IMAGE_TAG: git-${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/sdp-dev-telemetry-analyzer:${IMAGE_TAG}"
          echo "Building ${IMAGE}"
          docker build -t "${IMAGE}" -f deploy/images/telemetry-analyzer/Dockerfile .
          docker push "${IMAGE}"

      - name: Build and push cicd-agent
        env:
          IMAGE_TAG: git-${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/sdp-dev-cicd-agent:${IMAGE_TAG}"
          echo "Building ${IMAGE}"
          docker build -t "${IMAGE}" -f deploy/images/cicd-agent/Dockerfile .
          docker push "${IMAGE}"

  e2e-agentrun-minikube:
    name: E2E AgentRun (minikube)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Start minikube
        uses: medyagh/setup-minikube@v0.0.17
        with:
          minikube-version: latest
          kubernetes-version: v1.28.0

      - name: Apply CRDs
        run: |
          kubectl apply -f deploy/k8s/crd/

      - name: E2E AgentRun on minikube
        run: ./scripts/e2e_agentrun_minikube.sh --build-image
        env:
          SDP_ADAPTER_NS: sdp-adapter
