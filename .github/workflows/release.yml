# Release sdp_lab binaries (sdp-evidence, sdp-guard, sdp-orchestrate, etc.)
# Protocol E2E and sdp CLI release run from sdp repo (see sdp/.github/workflows/release.yml)
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Validate release surface consistency
        run: |
          set -euo pipefail
          echo "=== Pre-release surface validation ==="
          scripts/check-version-drift.sh
          scripts/check-public-metadata.sh
          scripts/check-release-surface.sh
          echo "All release surface checks passed."

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: 'v2.5.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: "1"
