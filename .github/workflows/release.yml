# Release SDP CLIs on tag push (e.g. v0.1.0)
# Publishes cross-platform binaries + signs checksums with Sigstore (keyless)
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write  # Required for Sigstore keyless signing

jobs:
  protocol-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Protocol E2E (Docker)
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: |
          docker build -f ci/Dockerfile.protocol-e2e -t sdp-protocol-e2e:latest .
          docker run --rm \
            -e GLM_API_KEY="${GLM_API_KEY}" \
            sdp-protocol-e2e:latest

  release:
    needs: protocol-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install cosign
        run: |
          curl -sLO https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x cosign-linux-amd64
          sudo mv cosign-linux-amd64 /usr/local/bin/cosign

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: 'v2.5.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: "1"
